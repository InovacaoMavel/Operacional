<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Hub Mavel</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="assets/styles.css" rel="stylesheet">
</head>
<body class="login-body">

  <main>
    <section class="login-card" aria-labelledby="loginTitle">

      <header class="login-card__header">
        <img src="assets/logo_seta.png" alt="Seta — Carro por Assinatura" class="login-card__logo">
        <p class="login-card__subtitle" id="loginTitle">Acesse o painel central de aplicações</p>
      </header>

      <div class="login-card__body">
        <form id="loginForm" novalidate>

          <div class="mb-3">
            <label for="email" class="form-label">E-mail</label>
            <div class="input-group">
              <span class="input-group-text" aria-hidden="true"><i class="bi bi-envelope"></i></span>
              <input type="email" class="form-control" id="email" name="email"
                     placeholder="nome@mavellocadora.com.br" autocomplete="username" required>
            </div>
            <div class="invalid-feedback">Informe um e-mail válido.</div>
          </div>

          <div class="mb-3">
            <label for="senha" class="form-label">Senha</label>
            <div class="input-group">
              <span class="input-group-text" aria-hidden="true"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control" id="senha" name="senha"
                     placeholder="Sua senha" autocomplete="current-password" required>
              <span class="input-group-text toggle-pass" id="togglePass" role="button"
                    tabindex="0" aria-label="Mostrar ou ocultar senha">
                <i class="bi bi-eye" aria-hidden="true"></i>
              </span>
            </div>
            <div class="invalid-feedback">Informe sua senha.</div>
          </div>

          <div class="d-flex align-items-center justify-content-between mb-3">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="lembrar">
              <label class="form-check-label small" for="lembrar">Lembrar-me</label>
            </div>
            <a href="#" class="small text-decoration-none text-accent">Esqueci a senha</a>
          </div>

          <button type="submit" class="btn btn-brand w-100 py-2">
            <i class="bi bi-box-arrow-in-right me-1" aria-hidden="true"></i> Entrar
          </button>

        </form>
      </div>

    </section>

    <p class="login-footer">© 2026 Mavel / Seta Locadora — Hub Corporativo</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
          crossorigin="anonymous"></script>
  <script>
    // Mostrar/ocultar senha
    const togglePass = document.getElementById('togglePass');
    const senha = document.getElementById('senha');
    function alternarSenha() {
      const oculto = senha.type === 'password';
      senha.type = oculto ? 'text' : 'password';
      togglePass.querySelector('i').className = oculto ? 'bi bi-eye-slash' : 'bi bi-eye';
    }
    togglePass.addEventListener('click', alternarSenha);
    togglePass.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); alternarSenha(); }
    });

    // Validação + redirecionamento para a home
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const form = e.currentTarget;
      if (!form.checkValidity()) {
        form.classList.add('was-validated');
        return;
      }
      // TODO: integrar autenticação real. Por ora, redireciona para a home.
      window.location.href = 'home.html';
    });
  </script>
</body>
</html>
